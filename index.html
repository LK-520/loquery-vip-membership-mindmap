<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080e1c">
  <title>Lo查查 VIP 会员体系 · 无限画布</title>
  <style>
    :root { --bg:#080e1c; --panel:#101a2c; --line:#27364e; --text:#edf7ff; --muted:#9bb0c8; --cyan:#62e7df; --violet:#bba6ff; --amber:#ffc77d; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; }
    body { color:var(--text); background:var(--bg); font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input { font:inherit; }
    button { color:inherit; }
    button:focus-visible,input:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
    #viewport { position:fixed; inset:0; overflow:hidden; touch-action:none; background:radial-gradient(circle at 50% 46%,#122947 0,#0a162a 38%,#080e1c 78%); }
    #viewport::before { content:""; position:absolute; inset:0; opacity:.42; background-image:linear-gradient(to right,#2b466244 1px,transparent 1px),linear-gradient(to bottom,#2b466244 1px,transparent 1px); background-size:var(--grid-size,32px) var(--grid-size,32px); background-position:var(--grid-x,0px) var(--grid-y,0px); pointer-events:none; }
    #viewport::after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 12% 80%,#1f85781b,transparent 28%),radial-gradient(circle at 88% 25%,#7559bb24,transparent 30%); pointer-events:none; }
    #world { position:absolute; left:0; top:0; width:3880px; height:2910px; transform-origin:0 0; will-change:transform; }
    #wires { position:absolute; inset:0; width:3880px; height:2910px; overflow:visible; pointer-events:none; }
    .wire { fill:none; stroke-width:2; stroke-linecap:round; opacity:.72; }
    .wire.front { stroke:#3acfc7; } .wire.admin { stroke:#9b7ef1; } .wire.rules { stroke:#e8ad66; }
    .wire.spine { stroke-dasharray:4 9; opacity:.48; animation:signal-flow 16s linear infinite; }
    .wire.admin-page,.wire.client-page { stroke-width:2.5; opacity:.9; }
    @keyframes signal-flow { to { stroke-dashoffset:-104; } }
    .wire-dot { fill:#0c1a2c; stroke-width:2.5; }
    .wire-dot.front { stroke:#3acfc7; } .wire-dot.admin { stroke:#9b7ef1; } .wire-dot.rules { stroke:#e8ad66; }
    .node { position:absolute; display:block; overflow:hidden; width:var(--w); height:var(--h); border:1px solid #34445d; border-radius:22px; padding:21px 23px; background:linear-gradient(155deg,#17253bdc,#111d30eb); box-shadow:0 18px 42px #0208138a,inset 0 1px #ffffff10; text-align:left; cursor:pointer; transition:border-color .18s,box-shadow .18s,transform .18s; }
    .node:hover { transform:translateY(-4px); border-color:#62e7df; box-shadow:0 24px 55px #020813b0,0 0 28px #62e7df24; }
    .node.active { border-color:#8cf3eb; box-shadow:0 0 0 2px #6ee7df33,0 20px 50px #020813a8,0 0 42px #5ce3db38; }
    .node::before { content:""; position:absolute; top:0; left:0; width:100%; height:3px; background:var(--accent,#62e7df); box-shadow:0 0 18px var(--accent,#62e7df); }
    .node::after { content:""; position:absolute; right:-30px; bottom:-76px; width:175px; height:175px; border-radius:50%; background:var(--glow,#2bccc62b); filter:blur(12px); pointer-events:none; }
    .node.root { --accent:#7cf8ea; --glow:#38d7c840; padding:27px 30px; border-color:#60cfc7; border-radius:28px; background:linear-gradient(125deg,#183f53,#102c43 54%,#133b4b); box-shadow:0 30px 70px #020813ad,0 0 55px #23c6b83b; }
    .node.root { animation:root-glow 7s ease-in-out infinite; }
    @keyframes root-glow { 50% { box-shadow:0 30px 70px #020813ad,0 0 78px #23c6b859; } }
    .node.hub.front,.node.leaf.front { --accent:#61dfd6; --glow:#37c6bd25; }
    .node.hub.admin,.node.leaf.admin { --accent:#b29afa; --glow:#9870e72b; }
    .node.hub.rules,.node.leaf.rules { --accent:#f0bf7f; --glow:#eaa65d28; }
    .node.hub { border-width:1.5px; background:linear-gradient(125deg,#1b3045,#142239); }
    .node .meta { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:13px; color:var(--accent); font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.15em; text-transform:uppercase; }
    .status { flex:none; border:1px solid currentColor; border-radius:999px; padding:4px 8px; color:#99e5d7; background:#15454164; font:700 10px/1 sans-serif; letter-spacing:0; white-space:nowrap; }
    .status.proposed { color:#f6d59c; background:#744d1638; } .status.open { color:#f0adc6; background:#803b5d38; }
    .node h2,.node h3 { position:relative; z-index:1; margin:0; color:#f5fbff; font-weight:760; letter-spacing:-.035em; line-height:1.28; }
    .node.root h2 { font-size:31px; } .node.hub h3 { font-size:25px; } .node.leaf h3 { font-size:23px; }
    .node p { position:relative; z-index:1; margin:11px 0 0; color:#b7cadd; font-size:14px; line-height:1.55; }
    .node.root p { color:#d2f6f1; font-size:15px; }
    .node .footer { position:absolute; z-index:1; left:23px; right:23px; bottom:18px; display:flex; justify-content:space-between; color:#82a3b8; font:650 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.12em; }
    .node .footer b { color:var(--accent); font-weight:700; }
    .node.root .footer { left:30px; right:30px; }
    .node.hub .footer { bottom:8px; }
    .topbar { position:fixed; z-index:10; top:18px; left:18px; right:18px; display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:67px; border:1px solid #35506d99; border-radius:17px; padding:10px 14px 10px 18px; background:#0d1829e8; box-shadow:0 12px 40px #0208138c; backdrop-filter:blur(16px); }
    .brand { display:flex; align-items:center; gap:11px; flex:none; }
    .brand-icon { display:grid; place-items:center; width:39px; height:39px; border:1px solid #5be2d8; border-radius:12px; color:#9ffff3; background:#20524c; box-shadow:0 0 22px #50dfd23a; font:900 17px/1 ui-monospace,SFMono-Regular,Menlo,monospace; }
    .brand small { display:block; color:#77b9bd; font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.22em; }
    .brand strong { display:block; margin-top:2px; font-size:17px; line-height:1.2; letter-spacing:-.02em; }
    .top-actions { display:flex; align-items:center; flex-wrap:wrap; justify-content:flex-end; gap:7px; }
    .nav,.icon-button { border:1px solid #3b516d; border-radius:9px; padding:8px 10px; background:#17263c; color:#bcd1e7; font-size:12px; font-weight:720; cursor:pointer; white-space:nowrap; }
    .nav:hover,.icon-button:hover { border-color:#61ddd4; color:#dffffb; background:#1c3b4b; }
    .nav.selected { color:#092a30; background:#78e7dc; border-color:#78e7dc; }
    .search { width:176px; height:34px; border:1px solid #3b516d; border-radius:9px; padding:0 10px; color:#f2f8ff; outline:none; background:#111f32; font-size:12px; }
    .search::placeholder { color:#7890a7; }
    .search:focus { border-color:var(--cyan); }
    .version { color:#a6bbd0; font:700 10px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.07em; }
    .left-hud { position:fixed; z-index:6; bottom:20px; left:20px; display:flex; flex-direction:column; gap:9px; pointer-events:none; }
    .hud-card { border:1px solid #344c69a8; border-radius:12px; padding:9px 12px; color:#a8bed3; background:#0d1a2bdc; box-shadow:0 9px 28px #02081374; backdrop-filter:blur(10px); font:650 11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.025em; }
    .hud-card strong { color:#78eadf; }
    .zoom { display:flex; gap:5px; pointer-events:auto; }
    .zoom button { width:36px; height:35px; border:1px solid #3c5973; border-radius:9px; color:#dceefa; background:#152a3e; font-size:18px; cursor:pointer; }
    .zoom button:hover { border-color:#66e5db; background:#214456; }
    .zoom output { min-width:65px; display:grid; place-items:center; border:1px solid #3c5973; border-radius:9px; background:#152a3e; color:#8ee9df; font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace; }
    .minimap { position:fixed; z-index:6; right:20px; bottom:20px; width:222px; border:1px solid #48627d; border-radius:14px; padding:11px; background:#0b1729ee; box-shadow:0 14px 38px #020813a2; backdrop-filter:blur(14px); }
    .minimap-head { display:flex; justify-content:space-between; margin-bottom:7px; color:#83a7c1; font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.13em; }
    .minimap svg { display:block; width:100%; height:auto; border:1px solid #294055; border-radius:7px; background:#0c182b; cursor:crosshair; }
    .mini-node { fill:#4a7782; } .mini-node.admin { fill:#866fc0; } .mini-node.rules { fill:#b58958; } .mini-node.root { fill:#75e9db; }
    #mini-view { fill:#66e7dd19; stroke:#8ff5e9; stroke-width:14; pointer-events:none; }
    .inspector { position:fixed; z-index:9; top:99px; right:18px; bottom:178px; width:min(452px,calc(100vw - 36px)); display:flex; flex-direction:column; border:1px solid #52708d; border-radius:20px; overflow:hidden; background:#0e1b2eea; box-shadow:0 30px 70px #020813c7; backdrop-filter:blur(22px); transform:translateX(calc(100% + 40px)); opacity:0; pointer-events:none; transition:transform .25s,opacity .25s; }
    .inspector.open { transform:translateX(0); opacity:1; pointer-events:auto; }
    .inspector-head { flex:none; padding:20px 22px 16px; border-bottom:1px solid #324b64; background:linear-gradient(120deg,#173749,#16243c); }
    .inspector-top { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; color:#79d9d5; font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.15em; }
    .close { display:grid; place-items:center; width:29px; height:29px; border:1px solid #54738a; border-radius:8px; background:#20394a; font-size:17px; cursor:pointer; }
    .close:hover { background:#2f5560; }
    .inspector h2 { margin:0; font-size:25px; line-height:1.25; }
    .inspector-intro { margin:7px 0 0; color:#b4cbd9; font-size:13px; }
    .inspector-body { overflow:auto; padding:18px 22px 22px; }
    .detail-block + .detail-block { margin-top:19px; }
    .detail-block h3 { display:flex; align-items:center; gap:8px; margin:0 0 9px; color:#a6eae5; font-size:13px; letter-spacing:.02em; }
    .detail-block h3::before { content:""; width:7px; height:7px; border-radius:50%; background:#69e5dc; box-shadow:0 0 10px #69e5dc; }
    .detail-block ul { margin:0; padding-left:18px; color:#c1d0df; font-size:13px; }
    .detail-block li + li { margin-top:7px; }
    .detail-block a { color:#8ceee6; overflow-wrap:anywhere; text-decoration-color:#58bdb6; }
    .prices { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin:0 0 18px; }
    .price { border:1px solid #2f6d6b; border-radius:10px; padding:10px 4px; background:#113539; text-align:center; }
    .price b { display:block; color:#8df7eb; font-size:16px; } .price span { display:block; color:#bbdbdf; font-size:11px; } .price small { display:block; color:#79a9af; font-size:10px; }
    .inspector-note { margin-top:18px; border-left:2px solid #deb475; border-radius:0 7px 7px 0; padding:9px 11px; background:#704b242b; color:#f2d2a4; font-size:12px; }
    .related { display:flex; flex-wrap:wrap; gap:7px; margin-top:19px; }
    .related button { border:1px solid #5d5793; border-radius:8px; padding:7px 9px; color:#dfd5ff; background:#332c56; font-size:12px; cursor:pointer; }
    .related button:hover { border-color:#bba6ff; background:#4a3a75; }
    .print-sheet { display:none; }
    @media (max-width:1050px) { .version { display:none; } .topbar { align-items:flex-start; } .search { width:140px; } .inspector { bottom:170px; } }
    @media (max-width:730px) { .topbar { top:9px; left:9px; right:9px; display:block; padding:10px; } .brand { margin-bottom:8px; } .brand strong { font-size:14px; } .brand-icon { width:31px; height:31px; font-size:14px; } .top-actions { justify-content:flex-start; } .nav,.icon-button { padding:6px 7px; font-size:10px; } .search { width:120px; height:29px; } .inspector { top:auto; left:8px; right:8px; bottom:9px; width:auto; height:min(72vh,620px); transform:translateY(calc(100% + 20px)); } .inspector.open { transform:translateY(0); } .minimap { right:9px; bottom:9px; width:150px; padding:7px; } .minimap-head { font-size:8px; } .left-hud { left:9px; bottom:9px; } .hud-card { max-width:185px; font-size:9px; padding:6px 8px; } .zoom button { width:28px; height:28px; font-size:14px; } .zoom output { min-width:48px; font-size:9px; } }
    @media (prefers-reduced-motion:reduce) { .node,.inspector,.wire.spine { transition:none; animation:none; } }
    @media print { html,body { height:auto; overflow:visible; color:#1c2b38; background:#fff; } #viewport,.topbar,.left-hud,.minimap,.inspector { display:none!important; } .print-sheet { display:block; padding:18mm; } .print-sheet h1 { font-size:25px; } .print-sheet h2 { margin-top:22px; border-bottom:1px solid #cbd6dc; padding-bottom:5px; font-size:17px; } .print-sheet h3 { font-size:13px; } .print-sheet p,.print-sheet li,.print-sheet .detail-block ul { color:#344656; font-size:11px; } .print-sheet .detail-block h3 { color:#146b67; } .print-sheet section { break-inside:avoid; } .print-sheet .prices { max-width:480px; } .print-sheet .price { background:#f1f7f7; } .print-sheet .price b { color:#146b67; } .print-sheet .price span,.print-sheet .price small { color:#536c73; } }
  </style>
</head>
<body>
  <div id="viewport" aria-label="可拖动和缩放的 VIP 会员体系思维导图">
    <div id="world"><svg id="wires" viewBox="0 0 3880 2910" aria-hidden="true"></svg><div id="nodes"></div></div>
  </div>
  <header class="topbar">
    <div class="brand"><div class="brand-icon" aria-hidden="true">L/</div><div><small>LOCHACHA / PRODUCT SYSTEM</small><strong>VIP 会员体系</strong></div></div>
    <div class="top-actions">
      <span class="version">INTERACTIVE MAP · 2026.09.25</span>
      <input class="search" id="search" type="search" aria-label="搜索导图节点" placeholder="搜索节点 ↵">
      <button class="nav selected" data-focus="root">全局</button><button class="nav" data-focus="front">用户端</button><button class="nav" data-focus="admin">管理端</button><button class="nav" data-focus="rules">统一规则</button>
      <button class="icon-button" id="fit" title="适应全部内容">全图</button><button class="icon-button" id="print" title="打印完整规则">打印</button>
    </div>
  </header>
  <aside class="left-hud" aria-label="画布操作">
    <div class="hud-card"><strong>DRAG</strong> 拖动画布　<strong>SCROLL / PINCH</strong> 缩放<br>每格是独立页面 · 青/紫箭头表示页面跳转 · Esc 关闭</div>
    <div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">+</button></div>
  </aside>
  <aside class="minimap" aria-label="导图小地图"><div class="minimap-head"><span>MINIMAP / 导航</span><span id="node-count">48 NODES</span></div><svg id="mini-svg" viewBox="0 0 3880 2910" role="img" aria-label="点击小地图移动画布"><rect id="mini-view" x="0" y="0" width="100" height="100"></rect></svg></aside>
  <aside class="inspector" id="inspector" aria-label="节点详情" aria-hidden="true"><div class="inspector-head"><div class="inspector-top"><span id="detail-meta">NODE DETAILS</span><button class="close" id="close" aria-label="关闭详情">×</button></div><h2 id="detail-title"></h2><p class="inspector-intro" id="detail-intro"></p></div><div class="inspector-body" id="detail-body"></div></aside>
  <main class="print-sheet" id="print-sheet"></main>
  <script>
    const WORLD = { width:3880, height:2910 };
    const prices = [['1 个月','¥9.8','¥9.8 / 月'],['3 个月','¥26.8','约 ¥8.93 / 月'],['6 个月','¥49.8','¥8.3 / 月'],['12 个月','¥88.8','¥7.4 / 月']];
    const nodes = [
      {id:'root',kind:'root',branch:'root',x:1670,y:100,w:520,h:210,code:'00 / CORE',title:'VIP 会员体系',summary:'四端同价；凭证主动领取、邀请券自动发放；跨端共享 VIP。',status:'已明确方向',blocks:[['产品方向',['1、3、6、12 个月固定期限单次购买，不自动续费；最长售卖档位是 1 年，不代表累计有效期只能有 1 年。','两条获得路径：购买会员；邀请好友自动获体验券并主动使用。','四项权益：每日穿搭、付费会员月凭证领取、头像挂件、VIP 专属客服。','已定稿：同一用户账号在 App 和小程序共享 VIP；同一档位四端同价，具体金额仍待定。']],['文档性质',['这是供产品和开发评审的讨论图。建议价、平台支付准入与部分细则尚未最终确认；不表示功能已开发或价格已生效。']]]},
      {id:'front',kind:'leaf',branch:'front',x:410,y:410,w:340,h:190,code:'CLIENT / 00',title:'VIP 会员首页',summary:'会员状态、到期时间和各页面入口。',status:'规划页面',blocks:[['首页信息',['展示未开通、有效、即将到期或已到期状态；服务端返回总有效期、付费期、来源与本期凭证可领状态。','可进入权益介绍、档位选择、购买记录、每日穿搭、交易凭证与领取页、头像挂件、专属客服、邀请好友和券包。']],['跨端规则 · 已定稿',['同一用户账号在 App 与小程序读取同一份 VIP 身份、有效期和权益状态；购买、用券或退款后重新查询即得到相同结果。','到期仍可查看历史穿搭、凭证与订单；未开通时不隐藏普通客服或当天穿搭入口。']]]},
      {id:'admin',kind:'leaf',branch:'admin',x:2770,y:410,w:340,h:190,code:'ADMIN / 00',title:'会员管理首页',summary:'待办、状态与常用页面入口。',status:'规划页面',blocks:[['页面内容',['展示待核实支付、待处理退款、对账差异、即将到期会员、邀请异常和 VIP 专属客服待接待数量。','每个数字可进入对应列表并保留筛选条件；展示最近处理记录和渠道准入状态提醒。']],['使用边界',['这是管理端真实首页的规划，不是把业务规则塞进一个总览页；具体操作都在独立页面完成。','运营、客服、财务看到各自权限内的入口和待办。']]]},
      {id:'rules',kind:'hub',branch:'rules',x:1720,y:2370,w:420,h:145,code:'03 / SHARED LOGIC',title:'统一规则 · 已定与待定',summary:'跨端同账号共享 VIP 已定；有效期算法等仍待拍板。',status:'部分定稿',blocks:[['统一规则',['已定稿：同一用户账号在 App 与小程序共享 VIP 身份、有效期和权益状态；两端都以服务端会员账本为准。','购买、用券、退款、人工调整与月度凭证额度要分别记来源；具体有效期算法与账号合并口径仍待拍板。']]]},

    function makeWires() {
      path('M 1670 205 C 1190 205 1020 335 750 505','front');

      svg('path',{d:'M 1 1 L 9 5 L 1 9',fill:'none',stroke:'#8df5ec','stroke-width':1.7},clientMarker);
      const clientPath=d=>svg('path',{d,class:'wire front client-page','marker-end':'url(#client-arrow)'},wires);

      clientPath('M 970 890 L 970 925 L 210 925 L 210 960'); // 订单确认 → 支付结果
      clientPath('M 970 1410 L 970 1445 L 210 1445 L 210 1480'); // 凭证发起 → 额度详情
      clientPath('M 1130 1315 L 1150 1315 L 1150 1950 L 590 1950 L 590 2000'); // 凭证发起 → VIP 凭证领取
      clientPath('M 370 1575 L 395 1575 L 395 1980 L 590 1980 L 590 2000'); // 凭证额度详情 → VIP 凭证领取
      clientPath('M 750 505 L 790 505 L 790 1315 L 810 1315'); // 会员首页 → 凭证发起
      clientPath('M 790 1315 L 790 1575 L 750 1575'); // 会员首页 → 挂件选择
      clientPath('M 790 1575 L 810 1575'); // 会员首页 → 专属客服
      clientPath('M 790 1575 L 790 1835 L 810 1835'); // 会员首页 → 我的体验券
      clientPath('M 410 505 L 25 505 L 25 1835 L 50 1835'); // 会员首页 → 邀请好友
      clientPath('M 25 1315 L 50 1315'); // 会员首页 → 每日穿搭
      const marker=svg('marker',{id:'admin-arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:7,markerHeight:7,orient:'auto-start-reverse'},defs);
      svg('path',{d:'M 1 1 L 9 5 L 1 9',fill:'none',stroke:'#d5c6ff','stroke-width':1.7},marker);
      const pagePath=d=>svg('path',{d,class:'wire admin admin-page','marker-end':'url(#admin-arrow)'},wires);
      const visualLinks=[
        ['a-tier','a-price'],['a-price','a-orders'],['a-orders','a-detail'],
        ['a-payment','a-payment-case'],['a-refunds','a-refund-detail'],
        ['a-recon','a-recon-diff'],['a-members','a-member'],
        ['a-invite','a-invite-review'],['a-invite-review','a-coupon'],
        ['a-support','a-support-settings'],
        ['a-detail','a-refund-detail'],['a-payment','a-recon'],

        ['a-member','a-coupon'],['a-coupon-rules','a-metrics'],['a-avatar','a-audit']
      ];
      for (const [from,to] of visualLinks) {
        const a=byId.get(from),b=byId.get(to);
        if (a.y===b.y) pagePath(`M ${a.x+a.w} ${a.y+a.h/2} L ${b.x} ${b.y+b.h/2}`);
        else pagePath(`M ${a.x+a.w/2} ${a.y+a.h} L ${b.x+b.w/2} ${b.y}`);
      }
      pagePath('M 2940 600 C 2970 645 3220 640 3220 700'); // 管理首页 → 订单列表

      for (const id of ['r-account','r-platform','r-qual','r-decisions']) {

    function renderNodes() {
      for (const n of nodes) {
        const el=document.createElement('button'); el.type='button'; el.className=`node ${n.kind} ${n.branch}`; el.dataset.id=n.id;
        el.style.cssText=`left:${n.x}px;top:${n.y}px;--w:${n.w}px;--h:${n.h}px`;
        const meta=document.createElement('div'); meta.className='meta';
        const code=document.createElement('span'); code.textContent=n.code;
        const badge=document.createElement('span'); badge.className=`status ${n.status.includes('待定')||n.status.includes('待核验')||n.status==='待拍板'||n.status==='需评审'?'open':n.status.includes('建议')?'proposed':''}`; badge.textContent=n.status;
        meta.append(code,badge);
        const title=document.createElement(n.kind==='root'?'h2':'h3'); title.textContent=n.title;
        const summary=document.createElement('p'); summary.textContent=n.summary;
        const footer=document.createElement('div'); footer.className='footer'; footer.innerHTML='<span>OPEN NODE / 点击查看</span><b>↗</b>';
        el.append(meta,title,summary,footer); el.addEventListener('click',()=>showNode(n.id)); nodeLayer.appendChild(el);
        const mini=svg('rect',{x:n.x,y:n.y,width:n.w,height:n.h,rx:34,class:`mini-node ${n.branch}`},miniSvg); mini.dataset.id=n.id;
      }
      miniSvg.appendChild(miniView);
      document.getElementById('node-count').textContent=`${nodes.length} NODES`;
    }
    function renderItem(item) { return escapeHtml(item).replace(/https:\/\/[^\s<]+/g,url=>`<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`); }
    function renderDetail(n,interactive=true) {
      const priceHtml=n.price?`<div class="prices">${prices.map(([term,amount,per])=>`<div class="price"><b>${escapeHtml(amount)}</b><span>${escapeHtml(term)}</span><small>${escapeHtml(per)}</small></div>`).join('')}</div>`:'';
      const blocks=n.blocks.map(([heading,items])=>`<section class="detail-block"><h3>${escapeHtml(heading)}</h3><ul>${items.map(item=>`<li>${renderItem(item)}</li>`).join('')}</ul></section>`).join('');
      const related=interactive?pageLinks.flatMap(([from,to,label])=>from===n.id?[[to,label]]:to===n.id?[[from,label]]:[]).map(([id,label])=>`<button type="button" data-related="${id}">${escapeHtml(label)} · ${escapeHtml(byId.get(id).title)}</button>`).join(''):'';
      return priceHtml+blocks+(related?`<section class="detail-block"><h3>关联页面 · 点击跳转</h3><div class="related">${related}</div></section>`:'')+(n.id==='root'?'<p class="inspector-note">讨论版：尚未接入支付、修改生产数据或发布会员能力。</p>':'');
    }
    function showNode(id) {
      const n=byId.get(id); if(!n) return;
      document.querySelectorAll('.node.active').forEach(el=>el.classList.remove('active'));
      nodeLayer.querySelector(`[data-id="${id}"]`).classList.add('active');
      document.getElementById('detail-meta').textContent=n.code+' · '+n.status;
      document.getElementById('detail-title').textContent=n.title;
      document.getElementById('detail-intro').textContent=n.summary;
      document.getElementById('detail-body').innerHTML=renderDetail(n);
      inspector.classList.add('open'); inspector.setAttribute('aria-hidden','false');
      focusNode(id,Math.max(view.z,.75),true);
    }
    function closeDetail() { inspector.classList.remove('open'); inspector.setAttribute('aria-hidden','true'); document.querySelectorAll('.node.active').forEach(el=>el.classList.remove('active')); }
    function renderView() {
      viewport.scrollTo(0,0);
      world.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.z})`;
      viewport.style.setProperty('--grid-size',`${32*view.z}px`);
      viewport.style.setProperty('--grid-x',`${view.x}px`); viewport.style.setProperty('--grid-y',`${view.y}px`);
      document.getElementById('zoom-value').textContent=`${Math.round(view.z*100)}%`;
      miniView.setAttribute('x',clamp(-view.x/view.z,0,WORLD.width));
      miniView.setAttribute('y',clamp(-view.y/view.z,0,WORLD.height));
      miniView.setAttribute('width',Math.min(viewport.clientWidth/view.z,WORLD.width));
      miniView.setAttribute('height',Math.min(viewport.clientHeight/view.z,WORLD.height));
    }
    function setCenter(wx,wy,z=view.z,withPanel=false) { view.z=clamp(z,.08,1.8); const available=viewport.clientWidth-(withPanel&&window.innerWidth>730?440:0); view.x=available/2-wx*view.z; view.y=viewport.clientHeight/2-wy*view.z; renderView(); }
    function focusNode(id,z,withPanel=false) { const n=byId.get(id); setCenter(n.x+n.w/2,n.y+n.h/2,z,withPanel); }
    function zoomAt(factor,cx=viewport.clientWidth/2,cy=viewport.clientHeight/2) { const z=clamp(view.z*factor,.08,1.8); const wx=(cx-view.x)/view.z,wy=(cy-view.y)/view.z; view.x=cx-wx*z; view.y=cy-wy*z; view.z=z; renderView(); }
    function fitAll() { closeDetail(); const z=Math.min((viewport.clientWidth-70)/WORLD.width,(viewport.clientHeight-110)/WORLD.height); setCenter(WORLD.width/2,WORLD.height/2,z); }
    function fitBranch(branch) { const items=nodes.filter(n=>n.branch===branch); const left=Math.min(...items.map(n=>n.x)),right=Math.max(...items.map(n=>n.x+n.w)),top=Math.min(...items.map(n=>n.y)),bottom=Math.max(...items.map(n=>n.y+n.h)); const z=Math.min((viewport.clientWidth-120)/(right-left),(viewport.clientHeight-210)/(bottom-top),.85); setCenter((left+right)/2,(top+bottom)/2,z); }
    function renderPrint() {
      const sheet=document.getElementById('print-sheet');
      sheet.innerHTML='<h1>Lo查查 VIP 会员体系</h1><p>产品讨论版 · 固定期限购买 + 邀请体验券。价格与部分规则尚待确认。</p>'+
        nodes.map(n=>`<section><h2>${escapeHtml(n.title)}</h2><p>${escapeHtml(n.summary)}</p>${renderDetail(n,false)}</section>`).join('');
    }
    makeWires(); renderNodes(); renderPrint();
    setCenter(1930,590,window.innerWidth<730?.59:.52);
    viewport.addEventListener('wheel',e=>{ e.preventDefault(); const r=viewport.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY*.0013),e.clientX-r.left,e.clientY-r.top); },{passive:false});
    const pointers=new Map(); let last=null,pinch=null;
    viewport.addEventListener('pointerdown',e=>{ if(e.target.closest('.node')) return; pointers.set(e.pointerId,[e.clientX,e.clientY]); viewport.setPointerCapture(e.pointerId); if(pointers.size===1){last=[e.clientX,e.clientY];pinch=null;} else if(pointers.size===2){const [a,b]=[...pointers.values()]; const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2; pinch={distance:Math.hypot(a[0]-b[0],a[1]-b[1]),z:view.z,wx:(cx-view.x)/view.z,wy:(cy-view.y)/view.z};} });
    viewport.addEventListener('pointermove',e=>{ if(!pointers.has(e.pointerId)) return; pointers.set(e.pointerId,[e.clientX,e.clientY]); if(pointers.size===2&&pinch){const [a,b]=[...pointers.values()];const cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;view.z=clamp(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/Math.max(pinch.distance,1),.08,1.8);view.x=cx-pinch.wx*view.z;view.y=cy-pinch.wy*view.z;renderView();} else if(last){view.x+=e.clientX-last[0];view.y+=e.clientY-last[1];last=[e.clientX,e.clientY];renderView();} });
    function endPointer(e){pointers.delete(e.pointerId);last=pointers.size===1?[...pointers.values()][0]:null;pinch=null;}
    viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
    document.getElementById('zoom-in').addEventListener('click',()=>zoomAt(1.22));
    document.getElementById('zoom-out').addEventListener('click',()=>zoomAt(1/1.22));
    document.getElementById('fit').addEventListener('click',fitAll);
    document.getElementById('print').addEventListener('click',()=>window.print());
    document.getElementById('close').addEventListener('click',closeDetail);
    document.getElementById('detail-body').addEventListener('click',e=>{const button=e.target.closest('[data-related]');if(button)showNode(button.dataset.related);});
    document.querySelectorAll('[data-focus]').forEach(button=>button.addEventListener('click',()=>{ document.querySelectorAll('[data-focus]').forEach(x=>x.classList.toggle('selected',x===button)); closeDetail(); const id=button.dataset.focus; if((id==='admin'||id==='front')&&window.innerWidth>500) fitBranch(id); else focusNode(id,id==='root'?(window.innerWidth<730?.59:.52):.78); }));
    search.addEventListener('keydown',e=>{ if(e.key==='Escape'){search.value='';closeDetail();search.blur();} if(e.key==='Enter'){const q=search.value.trim().toLowerCase(); if(!q)return; const hit=nodes.find(n=>n.title.toLowerCase().includes(q))||nodes.find(n=>[n.summary,...n.blocks.flatMap(block=>block[1])].join(' ').toLowerCase().includes(q)); if(hit)showNode(hit.id); else {search.value='';search.placeholder='未找到节点';} } });
    miniSvg.addEventListener('click',e=>{const rect=miniSvg.getBoundingClientRect();setCenter((e.clientX-rect.left)/rect.width*WORLD.width,(e.clientY-rect.top)/rect.height*WORLD.height);});
    window.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeDetail();return;} if(e.target===search)return; if(e.key==='+'||e.key==='=')zoomAt(1.22); if(e.key==='-')zoomAt(1/1.22); if(e.key==='0')fitAll(); if(e.key.startsWith('Arrow')){e.preventDefault(); const d=75; if(e.key==='ArrowLeft')view.x+=d; if(e.key==='ArrowRight')view.x-=d; if(e.key==='ArrowUp')view.y+=d; if(e.key==='ArrowDown')view.y-=d; renderView();} });
    window.addEventListener('resize',renderView);
    if(nodes.length!==new Set(nodes.map(n=>n.id)).size||nodes.some(n=>n.x<0||n.y<0||n.x+n.w>WORLD.width||n.y+n.h>WORLD.height)) throw new Error('导图节点坐标或 ID 无效');
    if(nodes.some((a,i)=>nodes.slice(i+1).some(b=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h))||pageLinks.some(([from,to])=>!byId.has(from)||!byId.has(to))) throw new Error('导图节点重叠或页面关联无效');
  </script>
